name: Windows Defender gate check

on:
  push:
    branches: [codex/1376-windows-defender]
    paths:
      - .github/workflows/windows-defender-gate-check.yml
      - scripts/verify-windows-defender.ps1

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.9.1
            sha256: 893438647667a4f6aeb2929897a0131dd95e5c0686ec2958e5968cdb75f3496b
            expected: 0
          - version: 0.9.2
            sha256: fee21f614136df8ff0a1e97649886060625c843d34e724b62410164634928dcb
            expected: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Stage known official artifact without execution
        shell: pwsh
        run: |
          New-Item -ItemType Directory samples
          Invoke-WebRequest 'https://github.com/Emanuele-web04/synara/releases/download/v${{ matrix.version }}/Synara-${{ matrix.version }}-x64.exe' -OutFile 'samples/installer.exe'
          if ((Get-FileHash samples/installer.exe -Algorithm SHA256).Hash -ne '${{ matrix.sha256 }}') { throw 'Baseline hash mismatch.' }
      - name: Exercise the actual release gate
        shell: pwsh
        run: |
          & pwsh -File scripts/verify-windows-defender.ps1 -AssetsDirectory samples -EvidenceDirectory defender-evidence
          $result = $LASTEXITCODE
          if ($result -ne ${{ matrix.expected }}) { throw "Gate returned $result; expected ${{ matrix.expected }}." }
          # An expected failure still needs manual review of the detection evidence;
          # an unrelated setup error does not validate the negative control.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-${{ matrix.version }}
          path: defender-evidence/
          if-no-files-found: error
