name: Windows Defender qualified installer runtime
on:
  push:
    branches: [codex/1376-installed-runtime]
    paths: [.github/workflows/windows-defender-runtime.yml]
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: qualified-experimental-installer-normal
          run-id: 36740232673
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: repack-evidence-normal
          run-id: 36740232673
          github-token: ${{ github.token }}
          path: repack-proof
      - name: Stage verified baseline and candidate
        shell: pwsh
        run: |
          Rename-Item candidate/Synara-0.9.2-x64-normal.exe Synara-0.9.2-x64.exe
          if ((Get-FileHash candidate/Synara-0.9.2-x64.exe).Hash -ne 'f48ef644748694f9538ec313e998bfa0def5b3776858d41537cae07261a18387') { throw 'Candidate hash mismatch.' }
          New-Item -ItemType Directory baseline
          Invoke-WebRequest 'https://github.com/Emanuele-web04/synara/releases/download/v0.9.1/Synara-0.9.1-x64.exe' -OutFile baseline/Synara-0.9.1-x64.exe
          if ((Get-FileHash baseline/Synara-0.9.1-x64.exe).Hash -ne '893438647667a4f6aeb2929897a0131dd95e5c0686ec2958e5968cdb75f3496b') { throw 'Baseline hash mismatch.' }
      - name: Qualify candidate and baseline before execution
        shell: pwsh
        run: |
          ./scripts/verify-windows-defender.ps1 -AssetsDirectory candidate -EvidenceDirectory candidate-evidence
          ./scripts/verify-windows-defender.ps1 -AssetsDirectory baseline -EvidenceDirectory baseline-evidence
      - name: Verify silent installation and upgrade preserve exact payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory runtime-evidence
          $install = Join-Path $env:RUNNER_TEMP 'SynaraQualification'
          $env:SYNARA_HOME = Join-Path $env:RUNNER_TEMP 'synara-qualification-home'
          $env:SYNARA_BETA_HOME = Join-Path $env:RUNNER_TEMP 'synara-qualification-beta-home'
          $env:SYNARA_DISABLE_AUTO_UPDATE = '1'
          $baseline = Start-Process -FilePath (Resolve-Path baseline/Synara-0.9.1-x64.exe).Path -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($baseline.ExitCode -ne 0) { throw "Baseline install failed: $($baseline.ExitCode)" }
          Get-ChildItem $install -Recurse -File | Select-Object FullName, Length | ConvertTo-Json | Set-Content runtime-evidence/baseline-files.json
          $before = (Get-Item (Join-Path $install 'Synara.exe')).VersionInfo.ProductVersion
          if ([version]$before -ne [version]'0.9.1.0') { throw "Unexpected installed baseline: $before" }
          $candidate = Start-Process -FilePath (Resolve-Path candidate/Synara-0.9.2-x64.exe).Path -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($candidate.ExitCode -ne 0) { throw "Candidate upgrade failed: $($candidate.ExitCode)" }
          $after = (Get-Item (Join-Path $install 'Synara.exe')).VersionInfo.ProductVersion
          if ([version]$after -ne [version]'0.9.2.0') { throw "Unexpected upgraded version: $after" }
          $manifest = @(Get-ChildItem repack-proof -Recurse -Filter payload-before.json)
          if ($manifest.Count -ne 1) { throw 'Expected exactly one original payload manifest.' }
          $expected = Get-Content $manifest[0].FullName -Raw | ConvertFrom-Json -AsHashtable
          Get-ChildItem $install -Recurse -File | Select-Object FullName, Length | ConvertTo-Json | Set-Content runtime-evidence/upgraded-files.json
          $verified = @()
          $mismatches = @()
          foreach ($entry in $expected.GetEnumerator()) {
            $file = Join-Path $install $entry.Key
            if (-not (Test-Path -LiteralPath $file)) { $mismatches += @{ path = $entry.Key; reason = 'missing' }; continue }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { $mismatches += @{ path = $entry.Key; reason = 'hash mismatch'; actual = $actual }; continue }
            $verified += @{ path = $entry.Key; sha256 = $actual }
          }
          @{ beforeVersion = $before; afterVersion = $after; verifiedFiles = $verified; mismatches = $mismatches } | ConvertTo-Json -Depth 6 | Set-Content runtime-evidence/installed-payload.json
          Get-MpComputerStatus | ConvertTo-Json -Depth 5 | Set-Content runtime-evidence/defender-status.json
          $detections = @(Get-MpThreatDetection)
          ConvertTo-Json -InputObject $detections -Depth 8 | Set-Content runtime-evidence/detections.json
          Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 100 | Select-Object TimeCreated, Id, Message | ConvertTo-Json -Depth 5 | Set-Content runtime-evidence/events.json
          # Same six ARM64-codec files are absent in the official0.9.1 installation.
          # Preserve the limitation; require every x64/runtime payload byte unchanged.
          $baselineFiles = Get-Content runtime-evidence/baseline-files.json -Raw | ConvertFrom-Json
          $knownMissing = @(
            'resources\app.asar.unpacked\node_modules\node-pty\third_party\conpty\1.23.251008001\win10-arm64\conpty.dll',
            'resources\app.asar.unpacked\node_modules\node-pty\third_party\conpty\1.23.251008001\win10-arm64\OpenConsole.exe',
            'resources\app.asar.unpacked\node_modules\node-pty\prebuilds\win32-arm64\winpty-agent.exe',
            'resources\app.asar.unpacked\node_modules\node-pty\prebuilds\win32-arm64\winpty.dll',
            'resources\app.asar.unpacked\node_modules\node-pty\prebuilds\win32-arm64\conpty\conpty.dll',
            'resources\app.asar.unpacked\node_modules\node-pty\prebuilds\win32-arm64\conpty\OpenConsole.exe'
          )
          if ($mismatches.Count -ne 6 -or $verified.Count -ne 334) { throw 'Unexpected installed payload coverage.' }
          foreach ($mismatch in $mismatches) {
            if ($mismatch.reason -ne 'missing' -or $mismatch.path -notin $knownMissing) { throw 'New installed payload regression.' }
            if (@($baselineFiles | Where-Object { $_.FullName.EndsWith($mismatch.path) }).Count -ne 0) { throw 'Missing candidate file was present in baseline.' }
          }
          if ($detections.Count -ne 0) { throw 'Defender detected a threat during installer runtime qualification.' }
          if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) { throw 'Real-time protection became inactive.' }
      - name: Verify actual installed x64 runtime using existing isolated smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content scripts/verify-packaged-desktop-startup.ts -Raw
          $original = 'const launch = prepareLaunch(options, extractionRoot);'
          if (-not $source.Contains($original)) { throw 'Smoke launch seam changed.' }
          $replacement = 'const installed = join(process.env.RUNNER_TEMP!, "SynaraQualification"); const launch = { command: join(installed, "Synara.exe"), args: [], cwd: installed, runtime: { executable: join(installed, "Synara.exe"), resourcesDirectory: join(installed, "resources") } };'
          $source.Replace($original, $replacement) | Set-Content scripts/verify-installed-experiment.ts
          node scripts/verify-installed-experiment.ts --assets-dir candidate --platform win --arch x64 --version 0.9.2
          if ($LASTEXITCODE -ne 0) { throw 'Installed startup or runtime dependency smoke failed.' }
          Get-MpComputerStatus | ConvertTo-Json -Depth 5 | Set-Content runtime-evidence/after-startup-status.json
          $detections = @(Get-MpThreatDetection)
          ConvertTo-Json -InputObject $detections -Depth 8 | Set-Content runtime-evidence/after-startup-detections.json
          if ($detections.Count -ne 0 -or -not (Get-MpComputerStatus).RealTimeProtectionEnabled) { throw 'Defender runtime qualification failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-installer-runtime-evidence
          path: |
            candidate-evidence/
            baseline-evidence/
            runtime-evidence/
