name: Windows Defender investigation

on:
  push:
    branches: [codex/1376-windows-defender]
    paths:
      - .github/workflows/windows-defender-investigation.yml
      - scripts/investigate-windows-defender.ps1
      - scripts/prepare-defender-components.py
      - scripts/repack-defender-candidate.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    name: Statically extract official installer components
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/prepare-defender-components.py
      - uses: actions/upload-artifact@v4
        with:
          name: defender-component-manifest
          path: defender-components/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: defender-components-0.9.1
          path: defender-components/0.9.1/
      - uses: actions/upload-artifact@v4
        with:
          name: defender-components-0.9.2
          path: defender-components/0.9.2/
      - uses: actions/upload-artifact@v4
        with:
          name: defender-full-payload
          path: defender-full-payload/
  repack:
    name: Repackage identical 0.9.2 payload (${{ matrix.variant }})
    needs: extract
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, store, zip]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts --filter @synara/scripts
      - name: Activate and verify Defender using the official clean baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory baseline
          Invoke-WebRequest 'https://github.com/Emanuele-web04/synara/releases/download/v0.9.1/Synara-0.9.1-x64.exe' -OutFile 'baseline/installer.exe'
          if ((Get-FileHash baseline/installer.exe -Algorithm SHA256).Hash -ne '893438647667a4f6aeb2929897a0131dd95e5c0686ec2958e5968cdb75f3496b') { throw 'Baseline hash mismatch.' }
          ./scripts/verify-windows-defender.ps1 -AssetsDirectory baseline -EvidenceDirectory baseline-evidence
      - uses: actions/download-artifact@v4
        with:
          name: defender-full-payload
          path: defender-payload
      - name: Package with the existing builder and unchanged released application
        run: node scripts/repack-defender-candidate.mjs defender-payload ${{ matrix.variant }}
      - name: Scan the candidate with the exact release gate
        shell: pwsh
        run: ./scripts/verify-windows-defender.ps1 -AssetsDirectory 'defender-candidates/${{ matrix.variant }}' -EvidenceDirectory candidate-evidence
      - name: Preserve packaging and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repack-evidence-${{ matrix.variant }}
          path: |
            baseline-evidence/
            candidate-evidence/
            defender-repack-${{ matrix.variant }}/payload-*.json
            defender-candidates/${{ matrix.variant }}/builder-effective-config.yaml
  compare:
    name: Scan official Windows installers without execution
    runs-on: windows-2022
    timeout-minutes: 25
    needs: extract
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compare Defender results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/investigate-windows-defender.ps1
      - name: Preserve scan evidence even on detection or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-defender-evidence
          path: defender-evidence/
          if-no-files-found: error
          retention-days: 14
