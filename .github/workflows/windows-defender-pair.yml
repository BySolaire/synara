name: Windows Defender same-definition pair
on:
  push:
    branches: [codex/1376-windows-defender]
    paths:
      - .github/workflows/windows-defender-pair.yml
      - scripts/compare-defender-pair.ps1
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qualified-experimental-installer-normal
          run-id: 36740232673
          github-token: ${{ github.token }}
          path: pair/normal
      - name: Stage and verify both exact artifacts before activating protection
        shell: pwsh
        run: |
          Rename-Item pair/normal/Synara-0.9.2-x64-normal.exe Synara-0.9.2-x64.exe
          New-Item -ItemType Directory pair/original
          Invoke-WebRequest 'https://github.com/Emanuele-web04/synara/releases/download/v0.9.2/Synara-0.9.2-x64.exe' -OutFile pair/original/Synara-0.9.2-x64.exe
          $hashes = @{ original = 'fee21f614136df8ff0a1e97649886060625c843d34e724b62410164634928dcb'; normal = 'f48ef644748694f9538ec313e998bfa0def5b3776858d41537cae07261a18387' }
          $proof = @()
          foreach ($name in $hashes.Keys) {
            $hash = (Get-FileHash "pair/$name/Synara-0.9.2-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $hashes[$name]) { throw "Hash mismatch: $name" }
            $proof += @{ name = $name; hashBefore = $hash }
          }
          $proof | ConvertTo-Json | Set-Content pair-hashes.json
      - name: Compare exact original and normal repack under one definition update
        shell: pwsh
        run: ./scripts/compare-defender-pair.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defender-pair-evidence
          path: |
            defender-evidence/
            pair-hashes.json
